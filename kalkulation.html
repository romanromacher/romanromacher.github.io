<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Kalkulation">
  <meta name="theme-color" content="#f5f5f3">
  <link rel="manifest" href="manifest-kalk.json">
  <title>Kalkulation</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #f5f5f3; color: #ffffff; font-family: 'Inter', sans-serif; min-height: 100vh; overscroll-behavior: none; }
    input, select, button { font-family: inherit; }
    input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
    #app { max-width: 720px; margin: 0 auto; }
    #sync-bar { position: fixed; top: 0; left: 0; right: 0; z-index: 100; text-align: center; font-size: 11px; padding: 6px; font-family: 'Inter', sans-serif; font-weight: 700; letter-spacing: 0.1em; transition: all .3s; transform: translateY(-100%); }
    #sync-bar.show { transform: translateY(0); }
    #sync-bar.saving { background: #f0f0ee; color: #bbb; }
    #sync-bar.saved { background: #e6f9ef; color: #00C853; }
    #sync-bar.error { background: #fae8e8; color: #E8000D; }
    @media (max-width: 480px) { body { font-size: 16px; } input, select, button { font-size: 16px !important; } }
  </style>
</head>
<body>
<div id="sync-bar">Gespeichert ✓</div>
<div id="app">Lädt...</div>

  
<script>
const SUPABASE_URL = 'https://jzpmwelaalyxohuxrkov.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp6cG13ZWxhYWx5eG9odXhya292Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2MjUzNTcsImV4cCI6MjA5NTIwMTM1N30.kbeX6AMb24fmtT9SBdpyMont76JypmjcSQtqUDpwWvM';
const USER_ID = 'roman';

const fmt = n => n.toLocaleString('de-DE', { style:'currency', currency:'EUR', maximumFractionDigits:0 });
const fmtK = n => { if(n===0) return '0 €'; if(Math.abs(n)>=1000) return (n/1000).toLocaleString('de-DE',{maximumFractionDigits:1})+'k €'; return n.toLocaleString('de-DE',{maximumFractionDigits:0})+' €'; };
const pct = (v,t) => t===0?0:Math.min(100,v/t*100);

const h = (tag, attrs, ...children) => {
  const el = document.createElement(tag);
  if (attrs) Object.entries(attrs).forEach(([k,v]) => {
    if (k==='style'&&typeof v==='object') Object.assign(el.style, v);
    else if (k.startsWith('on')) el.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k==='className') el.className=v;
    else el.setAttribute(k,v);
  });
  children.flat().forEach(c => { if(c==null) return; el.appendChild(typeof c==='string'?document.createTextNode(c):c); });
  return el;
};

// ── Supabase ──
async function sbGetAll() {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/kalk_projekte?user_id=eq.${USER_ID}&order=created_at.asc`, {
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' }
  });
  return await r.json();
}
async function sbUpsert(data) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/kalk_projekte?on_conflict=id`, {
    method: 'POST',
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': `Bearer ${SUPABASE_KEY}`,
      'Content-Type': 'application/json',
      'Prefer': 'return=minimal,resolution=merge-duplicates'
    },
    body: JSON.stringify(data)
  });
  if (!r.ok) {
    const err = await r.text();
    console.error('Supabase error:', err);
  }
  return r.ok;
}
async function sbDelete(id) {
  return fetch(`${SUPABASE_URL}/rest/v1/kalk_projekte?id=eq.${id}`, {
    method: 'DELETE',
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' }
  });
}

// ── State ──
let state = { projekte: [], selectedId: null, archivOpen: false };

let syncTimer = null;
function showSync(type, msg) {
  const bar = document.getElementById('sync-bar');
  bar.className = `show ${type}`;
  bar.textContent = msg;
  clearTimeout(syncTimer);
  if (type==='saved') syncTimer = setTimeout(() => bar.classList.remove('show'), 2000);
}

async function loadData() {
  showSync('saving', 'Lädt...');
  try {
    const rows = await sbGetAll();
    state.projekte = rows.map(r => ({ ...r, posten: r.posten||[] }));
    showSync('saved', 'Gespeichert ✓');
  } catch(e) { showSync('error', 'Verbindungsfehler'); }
  render();
}

async function saveProjekt(pr) {
  showSync('saving', 'Speichert...');
  try {
    await sbUpsert({ id: pr.id, user_id: USER_ID, name: pr.name, budget: pr.budget, status: pr.status, posten: pr.posten, updated_at: new Date().toISOString() });
    showSync('saved', 'Gespeichert ✓');
  } catch(e) { showSync('error', 'Fehler beim Speichern'); }
}

async function createProjekt(name, budget) {
  const id = crypto.randomUUID();
  const pr = { id, user_id: USER_ID, name, budget, status: 'aktiv', posten: [], created_at: new Date().toISOString(), updated_at: new Date().toISOString() };
  state.projekte.push(pr);
  state.selectedId = id;
  render();
  await saveProjekt(pr);
}

async function deleteProjekt(id) {
  state.projekte = state.projekte.filter(p=>p.id!==id);
  state.selectedId = null;
  render();
  await sbDelete(id);
}

function getProjekt() { return state.projekte.find(p=>p.id===state.selectedId); }

// ── Render ──
function render() {
  const app = document.getElementById('app');
  app.innerHTML = '';
  const pr = getProjekt();
  const aktiv = state.projekte.filter(p=>p.status!=='archiv');
  const archiv = state.projekte.filter(p=>p.status==='archiv');

  // HEADER
  const header = h('div', { style:{ padding:'14px 16px 12px', borderBottom:'1px solid #e0e0dc', background:'#f5f5f3' }},
    h('div', { style:{ fontSize:'15px', letterSpacing:'0.2em', textTransform:'uppercase', color:'#111', fontFamily:'Inter,sans-serif', marginBottom:'2px' }}, 'Produktion'),
    h('div', { style:{ display:'flex', justifyContent:'space-between', alignItems:'center', gap:'8px' }},
      h('div', { style:{ display:'flex', alignItems:'center', gap:'8px', minWidth:'0', overflow:'hidden' }},
        pr ? h('button', { style:{ background:'#e5e5e5', border:'1px solid #ddd', borderRadius:'6px', cursor:'pointer', color:'#111', fontSize:'15px', padding:'3px 8px', fontFamily:'Inter,sans-serif', fontWeight:'700', flexShrink:'0' },
          onClick: () => { state.selectedId = null; render(); }}, '←') : null,
        h('h1', { style:{ fontFamily:'Inter,sans-serif', fontWeight:'800', fontSize:'17px', color:'#111', whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}, pr ? pr.name : 'Kalkulation')
      ),
      pr ? h('div', { style:{ display:'flex', gap:'6px', flexShrink:'0' }},
        h('button', { style:{ background:'none', border:'1px solid #aaa33344', borderRadius:'6px', cursor:'pointer', color: pr.status==='archiv'?'#00C853':'#555', fontSize:'14px', padding:'4px 8px', fontFamily:'Inter,sans-serif', fontWeight:'700' },
          onClick: async () => { pr.status = pr.status==='archiv'?'aktiv':'archiv'; state.selectedId=null; render(); await saveProjekt(pr); }},
          pr.status==='archiv' ? 'Reaktivieren' : 'Archivieren'),
        h('button', { style:{ background:'none', border:'1px solid #E8000D22', borderRadius:'6px', cursor:'pointer', color:'#E8000D', fontSize:'14px', padding:'4px 8px', fontFamily:'Inter,sans-serif', fontWeight:'700' },
          onClick: () => deleteProjekt(pr.id)}, 'Löschen')
      ) : null
    )
  );

  const content = h('div', { style:{ padding:'12px 16px 80px' }},
    pr ? renderDetail(pr) : renderListe(aktiv, archiv)
  );

  app.append(header, content);
}

function renderListe(aktiv, archiv) {
  const wrap = h('div', { style:{ display:'flex', flexDirection:'column', gap:'10px' }});
  wrap.append(h('div', { style:{ fontSize:'16px', color:'#111', marginBottom:'4px' }}, `${aktiv.length} aktive Projekte`));

  aktiv.forEach(pr => {
    const ausgaben = pr.posten.reduce((s,p)=>s+p.betrag,0);
    const rest = pr.budget - ausgaben;
    const progress = pct(ausgaben, pr.budget);
    const pc = progress>=100?'#E8000D':progress>=80?'#F5A800':progress>=50?'#F5A800':'#00C853';
    const card = h('div', { style:{ background:'#ffffff', border:'1px solid #e0e0dc', borderRadius:'12px', padding:'16px', cursor:'pointer' },
      onClick: () => { state.selectedId = pr.id; render(); }});
    card.append(
      h('div', { style:{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:'12px' }},
        h('div', {},
          h('div', { style:{ fontFamily:'Inter,sans-serif', fontWeight:'800', fontSize:'15px', color:'#111', marginBottom:'3px' }}, pr.name),
          h('div', { style:{ fontSize:'16px', color:'#888888' }}, `${pr.posten.length} Posten`)
        ),
        h('div', { style:{ textAlign:'right' }},
          h('div', { style:{ fontSize:'15px', color:'#888888', textTransform:'uppercase', letterSpacing:'0.08em', marginBottom:'2px' }}, 'Gesamtbudget'),
          h('div', { style:{ fontFamily:'Inter,sans-serif', fontWeight:'800', fontSize:'16px', color:'#F5A800' }}, fmtK(pr.budget))
        )
      ),
      h('div', { style:{ height:'4px', background:'#ebebeb', borderRadius:'99px', overflow:'hidden', marginBottom:'8px' }},
        h('div', { style:{ height:'100%', width:`${progress}%`, background:pc, borderRadius:'99px' }})
      ),
      h('div', { style:{ display:'flex', justifyContent:'space-between' }},
        h('span', { style:{ fontSize:'16px', color:'#111' }}, `Ausgaben: `, h('span', { style:{ color:'#111' }}, fmtK(ausgaben))),
        h('span', { style:{ fontSize:'16px', color: rest>=0?'#00C853':'#E8000D', fontFamily:'Inter,sans-serif', fontWeight:'700' }},
          rest>=0 ? `${fmtK(rest)} frei` : `${fmtK(Math.abs(rest))} überzogen`)
      )
    );
    wrap.append(card);
  });

  if (aktiv.length === 0) wrap.append(h('div', { style:{ padding:'20px', textAlign:'center', color:'#ccc777', fontSize:'15px' }}, 'Keine aktiven Projekte'));

  // Neues Projekt
  const newCard = h('div', { style:{ background:'#f0f0ee', border:'1px dashed #ccc', borderRadius:'12px', padding:'16px' }});
  newCard.append(h('div', { style:{ fontSize:'15px', textTransform:'uppercase', letterSpacing:'0.1em', color:'#111', marginBottom:'10px' }}, '+ Neues Projekt'));
  const nameIn = h('input', { placeholder:'Projektname', style:{ background:'#ebebeb', border:'1px solid #ddd', borderRadius:'6px', padding:'9px 12px', color:'#111', fontSize:'15px', outline:'none', width:'100%', marginBottom:'8px' }});
  const row = h('div', { style:{ display:'grid', gridTemplateColumns:'1fr 60px', gap:'8px' }});
  const budgetIn = h('input', { type:'number', placeholder:'Gesamtbudget €', style:{ background:'#ebebeb', border:'1px solid #ddd', borderRadius:'6px', padding:'9px 12px', color:'#111', fontSize:'15px', outline:'none', width:'100%' }});
  const addBtn = h('button', { style:{ background:'#F5A800', border:'none', borderRadius:'6px', cursor:'pointer', color:'#000', fontFamily:'Inter,sans-serif', fontWeight:'800', fontSize:'15px' }}, '+');
  addBtn.addEventListener('click', () => { if (!nameIn.value.trim()) return; createProjekt(nameIn.value.trim(), parseFloat(budgetIn.value)||0); });
  row.append(budgetIn, addBtn);
  newCard.append(nameIn, row);
  wrap.append(newCard);

  // Archiv
  if (archiv.length > 0) {
    const archivBtn = h('button', { style:{ display:'flex', alignItems:'center', gap:'8px', background:'none', border:'none', cursor:'pointer', padding:'8px 0', width:'100%' },
      onClick: () => { state.archivOpen = !state.archivOpen; render(); }},
      h('span', { style:{ fontSize:'15px', textTransform:'uppercase', letterSpacing:'0.12em', color:'#888888', fontFamily:'Inter,sans-serif', fontWeight:'700' }}, `Archiv (${archiv.length})`),
      h('span', { style:{ color:'#111', fontSize:'15px' }}, state.archivOpen ? '▲' : '▼')
    );
    wrap.append(archivBtn);
    if (state.archivOpen) {
      archiv.forEach(pr => {
        const ausgaben = pr.posten.reduce((s,p)=>s+p.betrag,0);
        wrap.append(h('div', { style:{ background:'#f0f0ee', border:'1px solid #e8e8e5', borderRadius:'12px', padding:'14px 16px', cursor:'pointer', opacity:'0.7' },
          onClick: () => { state.selectedId = pr.id; render(); }},
          h('div', { style:{ display:'flex', justifyContent:'space-between', alignItems:'center' }},
            h('div', {},
              h('div', { style:{ fontFamily:'Inter,sans-serif', fontWeight:'700', fontSize:'16px', color:'#111' }}, pr.name),
              h('div', { style:{ fontSize:'16px', color:'#111', marginTop:'2px' }}, `${pr.posten.length} Posten · ${fmtK(ausgaben)} Ausgaben`)
            ),
            h('div', { style:{ fontFamily:'Inter,sans-serif', fontWeight:'800', fontSize:'16px', color:'#111' }}, fmtK(pr.budget))
          )
        ));
      });
    }
  }

  // Export / Import
  wrap.append(h('div', { style:{ background:'#fff', border:'1px solid #e0e0dc', borderRadius:'10px', padding:'16px 14px' }},
    h('div', { style:{ fontSize:'13px', textTransform:'uppercase', letterSpacing:'0.06em', color:'#888', marginBottom:'12px' }}, 'Datensicherung'),
    h('div', { style:{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:'10px' }},
      h('button', { style:{ background:'#111', border:'none', borderRadius:'8px', cursor:'pointer', color:'#fff', fontFamily:'Inter,sans-serif', fontWeight:'700', fontSize:'14px', padding:'12px', textAlign:'center' },
        onClick: () => exportData()
      }, '⬇ Export JSON'),
      h('label', { style:{ background:'#f5f5f3', border:'1px solid #ddd', borderRadius:'8px', cursor:'pointer', color:'#111', fontFamily:'Inter,sans-serif', fontWeight:'700', fontSize:'14px', padding:'12px', textAlign:'center', display:'block' }},
        '⬆ Import JSON',
        h('input', { type:'file', accept:'.json', style:{ display:'none' },
          onChange: e => { if (e.target.files[0]) importData(e.target.files[0]); }
        })
      )
    )
  ));

  return wrap;
}

function renderDetail(pr) {
  const ausgaben = pr.posten.reduce((s,p)=>s+p.betrag,0);
  const bezahlt = pr.posten.filter(p=>p.bezahlt).reduce((s,p)=>s+p.betrag,0);
  const offen = ausgaben - bezahlt;
  const rest = pr.budget - ausgaben;
  const progress = pct(ausgaben, pr.budget);
  const pc = progress>=100?'#E8000D':progress>=80?'#F5A800':progress>=50?'#F5A800':'#00C853';

  const wrap = h('div', { style:{ display:'flex', flexDirection:'column', gap:'12px' }});

  // Budget box
  const budgetBox = h('div', { style:{ background:'#ffffff', border:'1px solid #e0e0dc', borderRadius:'12px', padding:'12px 14px' }});
  const topRow = h('div', { style:{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'10px' }});
  const nameIn = h('input', { value: pr.name, style:{ background:'transparent', border:'none', outline:'none', color:'#111', fontSize:'16px', fontFamily:'Inter,sans-serif', fontWeight:'800', width:'100%' }});
  nameIn.addEventListener('input', e => { pr.name = e.target.value; clearTimeout(syncTimer); syncTimer=setTimeout(()=>saveProjekt(pr),0); });
  const budgetRight = h('div', { style:{ textAlign:'right', flexShrink:'0', marginLeft:'12px' }},
    h('div', { style:{ fontSize:'15px', textTransform:'uppercase', letterSpacing:'0.1em', color:'#888888', marginBottom:'2px' }}, 'Gesamtbudget'),
    h('div', { style:{ display:'flex', alignItems:'center', gap:'3px' }},
      h('input', { type:'number', value: pr.budget, style:{ background:'#ebebeb', border:'1px solid #ddd', borderRadius:'6px', padding:'2px 6px', color:'#F5A800', fontSize:'15px', fontFamily:'Inter,sans-serif', fontWeight:'800', outline:'none', width:'88px', textAlign:'right' },
        onInput: e => { pr.budget = parseFloat(e.target.value)||0; clearTimeout(syncTimer); syncTimer=setTimeout(()=>saveProjekt(pr),0); render(); }
      }),
      h('span', { style:{ color:'#F5A800', fontFamily:'Inter,sans-serif', fontWeight:'800', fontSize:'15px' }}, '€')
    )
  );
  topRow.append(h('div', { style:{ minWidth:'0' }}, nameIn), budgetRight);

  const progressBar = h('div', { style:{ height:'4px', background:'#ebebeb', borderRadius:'99px', overflow:'hidden', marginBottom:'8px' }},
    h('div', { style:{ height:'100%', width:`${Math.min(100, progress)}%`, background:pc, borderRadius:'99px' }})
  );

  const restBetrag = pr.budget - ausgaben;
  const restColor = restBetrag >= 0 ? '#00C853' : '#E8000D';

  const summGrid = h('div', { style:{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:'5px' }});
  [
    { label:'Budget', val: (restBetrag < 0 ? '− ' : '') + fmtK(Math.abs(restBetrag)), color: restColor },
    { label:'Ausgaben', val:fmtK(ausgaben), color:pc },
    { label:'Bezahlt', val:fmtK(bezahlt), color:'#00C853' },
    { label:'Noch offen (unbezahlt)', val:fmtK(offen), color: offen>0?'#F5A800':'#888' },
  ].forEach(k => summGrid.append(
    h('div', { style:{ background:'#f0f0ee', borderRadius:'7px', padding:'8px 10px', display:'flex', justifyContent:'space-between', alignItems:'center' }},
      h('div', { style:{ fontSize:'15px', textTransform:'uppercase', letterSpacing:'0.08em', color:'#888888' }}, k.label),
      h('div', { style:{ fontFamily:'Inter,sans-serif', fontWeight:'800', fontSize:'15px', color:k.color }}, k.val)
    )
  ));

  budgetBox.append(topRow, progressBar, summGrid);
  wrap.append(budgetBox);

  // Posten
  const postenHeader = h('div', { style:{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'10px' }},
    h('div', { style:{ fontSize:'15px', textTransform:'uppercase', letterSpacing:'0.1em', color:'#888888' }}, `Posten · ${pr.posten.length} Einträge`),
    h('div', { style:{ fontSize:'15px', color:'#111' }},
      h('span', { style:{ color:'#00C853' }}, `${pr.posten.filter(p=>p.bezahlt).length} bezahlt`),
      ' · ',
      h('span', { style:{ color:'#F5A800' }}, `${pr.posten.filter(p=>!p.bezahlt).length} offen`)
    )
  );

  const postenList = h('div', { style:{ display:'flex', flexDirection:'column', gap:'6px' }});
  pr.posten.forEach(p => {
    const borderColor = p.bezahlt ? '#00C85330' : '#e0e0dc';
    const bgColor = p.bezahlt ? '#e6f9ef' : '#ffffff';
    const row = h('div', { style:{ display:'flex', flexDirection:'column', gap:'8px', padding:'10px 12px', background: bgColor, borderRadius:'8px', border:'1px solid ' + borderColor }});

    const nameIn = document.createElement('textarea');
    nameIn.value = p.name;
    nameIn.rows = 1;
    Object.assign(nameIn.style, { background:'transparent', border:'none', outline:'none', color: p.bezahlt?'#888':'#111', fontSize:'15px', textDecoration: p.bezahlt?'line-through':'none', width:'100%', resize:'none', fontFamily:'Inter,sans-serif', overflow:'hidden', lineHeight:'1.4', padding:'0', fontWeight:'500' });
    nameIn.addEventListener('input', e => {
      e.target.style.height = 'auto';
      e.target.style.height = e.target.scrollHeight + 'px';
      p.name = e.target.value;
      clearTimeout(syncTimer); syncTimer=setTimeout(()=>saveProjekt(pr),0);
    });
    setTimeout(() => { nameIn.style.height = 'auto'; nameIn.style.height = nameIn.scrollHeight + 'px'; }, 0);

    const bottomRow = h('div', { style:{ display:'flex', justifyContent:'space-between', alignItems:'center' }});
    const betragIn = h('input', { type:'number', value: p.betrag, style:{ background:'#f5f5f3', border:'1px solid #ddd', borderRadius:'5px', padding:'3px 7px', color: p.bezahlt?'#888':'#111', fontSize:'15px', width:'90px', textAlign:'right', outline:'none' }});
    betragIn.addEventListener('input', e => { p.betrag = parseFloat(e.target.value)||0; clearTimeout(syncTimer); syncTimer=setTimeout(()=>saveProjekt(pr),0); render(); });

    const toggle = h('div', { style:{ cursor:'pointer', display:'flex', alignItems:'center', gap:'6px' },
      onClick: () => { p.bezahlt = !p.bezahlt; saveProjekt(pr); render(); }},
      h('div', { style:{ width:'36px', height:'20px', borderRadius:'99px', background: p.bezahlt?'#00C853':'#ddd', position:'relative', transition:'background .2s', flexShrink:'0' }},
        h('div', { style:{ position:'absolute', top:'3px', left: p.bezahlt?'19px':'3px', width:'14px', height:'14px', borderRadius:'50%', background:'#fff', transition:'left .2s' }})
      ),
      h('span', { style:{ fontSize:'13px', color: p.bezahlt?'#00C853':'#888', fontFamily:'Inter,sans-serif', fontWeight:'600' }}, p.bezahlt?'Bezahlt':'Offen')
    );

    const del = h('button', { style:{ background:'none', border:'none', cursor:'pointer', color:'#ccc', fontSize:'18px', padding:'0' }}, '×');
    del.addEventListener('click', () => { pr.posten = pr.posten.filter(pp=>pp.id!==p.id); saveProjekt(pr); render(); });

    const betragWrap = h('div', { style:{ display:'flex', alignItems:'center', gap:'6px' }},
      h('span', { style:{ color:'#888', fontSize:'13px' }}, '€'),
      betragIn
    );
    bottomRow.append(betragWrap, toggle, del);
    row.append(nameIn, bottomRow);
    postenList.append(row);
  });

  // Neue Posten Zeile
  const addRow = h('div', { style:{ display:'flex', flexDirection:'column', gap:'8px', padding:'10px 12px', background:'#f0f0ee', borderRadius:'8px', border:'1px dashed #ccc' }});
  const newName = h('input', { placeholder:'+ Neuer Posten', style:{ background:'transparent', border:'none', outline:'none', color:'#111', fontSize:'15px', fontFamily:'Inter,sans-serif', width:'100%' }});
  const newBottomRow = h('div', { style:{ display:'flex', justifyContent:'space-between', alignItems:'center' }});
  const newBetrag = h('input', { type:'number', placeholder:'0', style:{ background:'#fff', border:'1px solid #ddd', borderRadius:'5px', padding:'3px 7px', color:'#111', fontSize:'15px', width:'90px', textAlign:'right', outline:'none' }});
  const addBtn = h('button', { style:{ background:'#F5A800', border:'none', borderRadius:'6px', cursor:'pointer', color:'#000', fontWeight:'800', fontSize:'15px', padding:'5px 16px', fontFamily:'Inter,sans-serif' }}, '+ Hinzufügen');
  addBtn.addEventListener('click', () => {
    if (!newName.value.trim()) return;
    pr.posten.push({ id: Date.now(), name: newName.value.trim(), betrag: parseFloat(newBetrag.value)||0, bezahlt: false });
    newName.value = ''; newBetrag.value = '';
    saveProjekt(pr); render();
  });
  newBottomRow.append(
    h('div', { style:{ display:'flex', alignItems:'center', gap:'6px' }}, h('span', { style:{ color:'#888', fontSize:'13px' }}, '€'), newBetrag),
    addBtn
  );
  addRow.append(newName, newBottomRow);
  postenList.append(addRow);

  wrap.append(h('div', {}, postenHeader, postenList));
  return wrap;
}


function exportData() {
  const data = {
    exportDatum: new Date().toISOString(),
    projekte: state.projekte,
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `romans-kalkulation-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importData(file) {
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if (data.projekte) {
        state.projekte = data.projekte;
        data.projekte.forEach(pr => sbUpsert(pr));
      }
      render();
      alert('Import erfolgreich ✓');
    } catch(e) { alert('Fehler beim Import — ungültige Datei'); }
  };
  reader.readAsText(file);
}

loadData();
