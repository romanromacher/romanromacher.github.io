// ── Supabase helpers ──
async function sbGet(table, filter) {
  const url = `${SUPABASE_URL}/rest/v1/${table}?${filter}&limit=1&apikey=${SUPABASE_KEY}`;
  const r = await fetch(url, { headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' }});
  const d = await r.json();
  return d[0] || null;
}
async function sbUpsert(table, data) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}`, {
    method: 'POST',
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': `Bearer ${SUPABASE_KEY}`,
      'Content-Type': 'application/json',
      'Prefer': 'return=minimal,resolution=merge-duplicates'
    },
    body: JSON.stringify(data)
  });
  if (!r.ok) {
    const err = await r.text();
    console.error('Supabase error:', err);
  }
  return r.ok;
}

async function sbUpsertOn(table, onConflict, data) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}?on_conflict=${encodeURIComponent(onConflict)}`, {
    method: 'POST',
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': `Bearer ${SUPABASE_KEY}`,
      'Content-Type': 'application/json',
      'Prefer': 'return=minimal,resolution=merge-duplicates'
    },
    body: JSON.stringify(data)
  });
  if (!r.ok) {
    const err = await r.text();
    console.error('Supabase upsert error:', table, err);
  }
  return r.ok;
}

// ── Sync ──
let syncTimer = null;
function showSync(type, msg) {
  const bar = document.getElementById('sync-bar');
  bar.className = `show ${type}`;
  bar.textContent = msg;
  clearTimeout(syncTimer);
  if (type === 'saved') syncTimer = setTimeout(() => bar.classList.remove('show'), 2000);
}

async function loadData() {
  showSync('saving', 'Lädt...');
  try {
    const settings = await sbGet('fp_settings', `user_id=eq.${USER_ID}`);
    if (settings) {
      state.ziel = settings.ziel;
      state.steuersatz = settings.steuersatz;
      if (settings.kosten_betrieb?.length) state.kostenBetrieb = settings.kosten_betrieb;
      if (settings.kosten_privat?.length) state.kostenPrivat = settings.kosten_privat;
      if (settings.rechnungen?.length) state.rechnungen = settings.rechnungen;
    }
    // Load all months
    const r = await fetch(`${SUPABASE_URL}/rest/v1/fp_month_data?user_id=eq.${USER_ID}&year=eq.${NOW_YEAR}`, {
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' }
    });
    const months = await r.json();
    months.forEach(m => { state.monthData[m.month] = { month: m.month, jobs: m.jobs || [], sonderzahlungen: m.sonderzahlungen||[] }; });
    state.loaded = true;
    showSync('saved', 'Gespeichert ✓');
  } catch(e) {
    showSync('error', 'Verbindungsfehler');
  }
  render();
}

let saveTimer = null;

async function saveData() {
  try {
    await sbUpsertOn('fp_settings', 'user_id', {
      user_id: USER_ID, ziel: state.ziel, steuersatz: state.steuersatz,
      kosten_betrieb: state.kostenBetrieb, kosten_privat: state.kostenPrivat,
      updated_at: new Date().toISOString()

    const m = state.monthData[state.selectedMonth];
    await sbUpsertOn('fp_month_data', 'user_id,year,month', {
      user_id: USER_ID, year: NOW_YEAR, month: state.selectedMonth, jobs: m.jobs, sonderzahlungen: m.sonderzahlungen||[], updated_at: new Date().toISOString()
    });
    showSync('saved', 'Gespeichert ✓');
  } catch(e) { showSync('error', 'Fehler beim Speichern'); }
}

// ── Helpers ──
const fmt = n => n.toLocaleString('de-DE', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 });
const fmtK = n => { if (n===0) return '0 €'; if (Math.abs(n)>=1000) return (n/1000).toLocaleString('de-DE',{maximumFractionDigits:1})+'k'; return n.toLocaleString('de-DE',{maximumFractionDigits:0})+' €'; };
const pct = (v,t) => t===0 ? 0 : Math.min(100, v/t*100);
const h = (tag, attrs, ...children) => {
  const el = document.createElement(tag);
  if (attrs) Object.entries(attrs).forEach(([k,v]) => {
    if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
    else if (k.startsWith('on')) el.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === 'className') el.className = v;
    else el.setAttribute(k, v);
  });
  children.flat().forEach(c => { if (c == null) return; el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
  return el;
};

function calcMonth(jobs, kb, kp, st, sonderzahlungen) {
  const bestNetto = jobs.filter(j=>j.status==='bestaetigt').reduce((s,j)=>s+j.betrag,0);
  const offenNetto = jobs.filter(j=>j.status!=='bestaetigt').reduce((s,j)=>s+j.betrag,0);
  const totalKosten = [...kb,...kp].reduce((s,i) => s + (i.isBrutto ? i.betrag/1.19 : i.betrag), 0);
  const totalSonder = (sonderzahlungen||[]).reduce((s,i) => s + (i.isBrutto ? i.betrag/1.19 : i.betrag), 0);
  const steuer = bestNetto*(st/100);
  const prodK = jobs.filter(j=>j.status==='bestaetigt').reduce((s,j)=>s+(j.prodKosten||0),0);
  const marge = bestNetto - prodK;
  const nachAllem = marge - steuer - totalKosten - totalSonder;
  const mwst = bestNetto*0.19;
  return { bestNetto, offenNetto, totalKosten, totalSonder, steuer, nachAllem, mwst, brutto: bestNetto+mwst, prodK, marge };
}

function renderDashboard(cur, currentJobs, ziel, steuersatz, pc, zielErreicht, allCalc) {

    ].map(row => h('div', { style:{ display:'flex', justifyContent:'space-between', alignItems:'center', padding:'10px 14px', borderBottom:'1px solid #eee', background: row.bg||'transparent' }},
      h('span', { style:{ fontSize:'13px', textTransform:'uppercase', letterSpacing:'0.1em', color: row.bg?'#888':'#888888' }}, row.label),
      h('span', { style:{ fontFamily:'Inter,sans-serif', fontWeight: row.bg?'800':'700', fontSize: row.bg?'18px':'14px', color:row.color }}, row.raw ? row.val : fmt(row.val))
    ))
  ) : null;

  // Was-wäre-wenn
  const wwwBox = cur.offenNetto > 0 ? h('div', { style:{ background:'#ffffff', border:'1px solid #F5A80015', borderRadius:'10px', padding: isMobile ? '14px 16px' : '12px 14px' }},
    h('div', { style:{ fontSize:'13px', textTransform:'uppercase', letterSpacing:'0.1em', color:'#888888', marginBottom:'6px' }}, 'Wenn alle offenen Jobs bestätigt werden...'),
    h('div', { style:{ display:'flex', justifyContent:'space-between', alignItems:'center' }},
      h('span', { style:{ fontSize:'15px', color:'#111' }}, `Umsatz wäre ${fmt(cur.bestNetto + cur.offenNetto)}`),
      h('span', { style:{ fontFamily:'Inter,sans-serif', fontWeight:'800', fontSize:'15px', color: cur.bestNetto+cur.offenNetto>=ziel?'#00C853':'#F5A800' }},
        cur.bestNetto+cur.offenNetto>=ziel ? '✓ Ziel erreicht' : `noch ${fmt(ziel-cur.bestNetto-cur.offenNetto)} fehlen`)
    )
  ) : null;

  // Steuer slider
  const steuerBox = h('div', { style:{ background:'#ffffff', border:'1px solid #e0e0dc', borderRadius:'10px', padding: isMobile ? '16px' : '14px' }},
    h('div', { style:{ display:'flex', justifyContent:'space-between', marginBottom:'8px' }},
      h('div', {},
        h('div', { style:{ fontSize:'15px', color:'#111' }}, 'Steuerlast'),
        h('div', { style:{ fontSize:'14px', color:'#111' }}, 'Einkommensteuer-Schätzung')
      ),
      h('div', { style:{ fontFamily:'Inter,sans-serif', fontWeight:'800', fontSize:'16px', color:'#E8000D' }}, `${state.steuersatz}%`)
    ),
    h('input', { type:'range', min:'15', max:'45', step:'1', value: state.steuersatz, style:{ width:'100%', accentColor:'#E8000D', cursor:'pointer' },
      onInput: e => { state.steuersatz = Number(e.target.value); saveData(); render(); }
    })
  );

  wrap.append(grid, mwstBox, ergebnis);
  if (prodBox) wrap.append(prodBox);
  if (wwwBox) wrap.append(wwwBox);

  // Offene Rechnungen Box
  const offeneRechnungen = state.rechnungen.filter(r => r.status === 'offen');
  const offenRechnungenBetrag = offeneRechnungen.reduce((s,r) => s + r.betrag, 0);
  if (offeneRechnungen.length > 0) {
    wrap.append(h('div', { style:{ background:'#fff', border:'1px solid #00C85320', borderRadius:'10px', padding: isMobile?'14px 16px':'12px 14px' }},
      h('div', { style:{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'10px' }},
        h('div', {},
          h('div', { style:{ fontSize:'13px', textTransform:'uppercase', letterSpacing:'0.06em', color:'#888', marginBottom:'2px' }}, 'Offene Rechnungen'),
          h('div', { style:{ fontSize:'13px', color:'#aaa' }}, `${offeneRechnungen.length} Rechnung${offeneRechnungen.length!==1?'en':''} noch offen`)
        ),
        h('div', { style:{ fontFamily:'Inter,sans-serif', fontWeight:'800', fontSize:'20px', color:'#00C853' }}, fmtK(offenRechnungenBetrag))
      ),
      ...offeneRechnungen.slice(0,3).map(r => h('div', { style:{ display:'flex', justifyContent:'space-between', padding:'6px 0', borderTop:'1px solid #eee' }},
        h('span', { style:{ fontSize:'13px', color:'#555' }}, r.name),
        h('span', { style:{ fontSize:'13px', fontWeight:'700', color:'#111' }}, fmt(r.betrag))
      )),
      offeneRechnungen.length > 3 ? h('div', { style:{ fontSize:'12px', color:'#aaa', marginTop:'6px', borderTop:'1px solid #eee', paddingTop:'6px' }}, `+ ${offeneRechnungen.length-3} weitere`) : null
    ));
  }

  wrap.append(steuerBox);
  return wrap;
}

function renderJobs(currentJobs, cur, selectedMonth) {
  const wrap = h('div', { style:{ display:'flex', flexDirection:'column', gap: isMobile ? '10px' : '8px' }});
  wrap.append(h('div', { style:{ fontSize:'16px', color:'#888888', marginBottom:'2px' }},
    currentJobs.length === 0 ? `Noch keine Jobs im ${MONATE_LANG[selectedMonth]}` : `${currentJobs.length} Jobs · ${fmt(cur.bestNetto)} bestätigt · ${fmt(cur.offenNetto)} offen`
  ));

  currentJobs.forEach(job => {
    const statusColor = job.status==='bestaetigt'?'#00C853':job.status==='offen'?'#F5A800':'#ffffff';
    const card = h('div', { style:{ background:'#ffffff', border:`1px solid ${statusColor}15`, borderRadius:'10px', padding:'10px 12px' }});
    const row1 = h('div', { style:{ display:'grid', gridTemplateColumns:'1fr 95px 105px 26px', gap:'6px', alignItems:'center', marginBottom:'4px' }});

    const nameIn = h('input', { value: job.name, style:{ background:'transparent', border:'none', outline:'none', color:'#111', fontSize:'15px', minWidth:'0' }});
    nameIn.addEventListener('input', e => { job.name = e.target.value; saveData(); });

    const betragIn = h('input', { type:'number', value: job.betrag, style:{ background:'#ebebeb', border:'1px solid #ddd', borderRadius:'5px', padding:'3px 5px', color:'#111', fontSize:'15px', width:'100%', textAlign:'right', outline:'none' }});
    betragIn.addEventListener('input', e => { job.betrag = parseFloat(e.target.value)||0; saveData(); render(); });

    const statusSel = h('select', { style:{ background:'#ebebeb', border:'1px solid #ddd', borderRadius:'5px', padding:'4px', fontSize:'14px', fontFamily:'Inter,sans-serif', fontWeight:'700', cursor:'pointer', outline:'none', color:statusColor }},
      h('option', { value:'bestaetigt' }, '✓ Bestätigt'),
      h('option', { value:'offen' }, '◌ Offen'),
      h('option', { value:'anfrage' }, '? Anfrage')
    );
    statusSel.value = job.status;
    statusSel.addEventListener('change', e => { job.status = e.target.value; saveData(); render(); });

    const delBtn = h('button', { style:{ background:'none', border:'none', cursor:'pointer', color:'#111', fontSize:'16px' }}, '×');
    delBtn.addEventListener('click', () => { state.monthData[selectedMonth].jobs = state.monthData[selectedMonth].jobs.filter(j=>j.id!==job.id); saveData(); render(); });

    row1.append(nameIn, h('div', { style:{ display:'flex', alignItems:'center', gap:'3px' }}, betragIn, h('span', { style:{ color:'#111', fontSize:'14px' }}, '€')), statusSel, delBtn);

    // Produktionskosten
    const prodRow = h('div', { style:{ display:'flex', alignItems:'center', gap:'6px', paddingTop:'6px', borderTop:'1px solid #eee' }});
    const prodIn = h('input', { type:'number', value: job.prodKosten||'', placeholder:'Produktionskosten €', style:{ background:'#ebebeb', border:'1px solid #e0e0dc', borderRadius:'5px', padding:'2px 6px', color:'#E8000D', fontSize:'16px', width:'100px', textAlign:'right', outline:'none' }});
    prodIn.addEventListener('input', e => { job.prodKosten = parseFloat(e.target.value)||0; saveData(); render(); });
    prodRow.append(h('span', { style:{ fontSize:'14px', color:'#888888' }}, 'Prod.kosten:'), prodIn, h('span', { style:{ fontSize:'14px', color:'#888888' }}, '€'));
    if ((job.prodKosten||0) > 0) prodRow.append(h('span', { style:{ fontSize:'14px', color:'#111', marginLeft:'auto' }}, 'Marge: ', h('span', { style:{ color:'#00C853', fontFamily:'Inter,sans-serif', fontWeight:'700' }}, fmt(job.betrag-(job.prodKosten||0)))));

    card.append(row1, prodRow);
    wrap.append(card);
  });

  // Neuer Job
  const newCard = h('div', { style:{ background:'#ffffff', border:'1px dashed #ccc', borderRadius:'10px', padding:'12px' }});
  newCard.append(h('div', { style:{ fontSize:'13px', textTransform:'uppercase', letterSpacing:'0.1em', color:'#111', marginBottom:'8px' }}, `+ Job eintragen für ${MONATE_LANG[selectedMonth]}`));
  const nameIn = h('input', { placeholder:'Projektname / Kunde', style:{ background:'#ebebeb', border:'1px solid #ddd', borderRadius:'6px', padding:'8px 10px', color:'#111', fontSize:'15px', outline:'none', width:'100%', marginBottom:'8px' }});
  const row2 = h('div', { style:{ display:'grid', gridTemplateColumns:'1fr 1fr', gap: isMobile ? '10px' : '8px', marginBottom:'8px' }});
  const betragIn = h('input', { type:'number', placeholder:'Umsatz netto €', style:{ background:'#ebebeb', border:'1px solid #ddd', borderRadius:'6px', padding:'8px 10px', color:'#111', fontSize:'15px', outline:'none', width:'100%' }});
  const prodIn = h('input', { type:'number', placeholder:'Produktionskosten € (optional)', style:{ background:'#ebebeb', border:'1px solid #e0e0dc', borderRadius:'6px', padding:'8px 10px', color:'#E8000D', fontSize:'15px', outline:'none', width:'100%' }});
  const row3 = h('div', { style:{ display:'grid', gridTemplateColumns:'1fr 52px', gap: isMobile ? '10px' : '8px' }});
  const statusSel = h('select', { style:{ background:'#ebebeb', border:'1px solid #ddd', borderRadius:'6px', padding:'8px 5px', color:'#111', fontSize:'14px', fontFamily:'Inter,sans-serif', outline:'none', cursor:'pointer' }},
    h('option', { value:'bestaetigt' }, '✓ Bestätigt'),
    h('option', { value:'offen' }, '◌ Offen'),
    h('option', { value:'anfrage' }, '? Anfrage')
  );
  const addBtn = h('button', { style:{ background:'#F5A800', border:'none', borderRadius:'6px', cursor:'pointer', color:'#000', fontFamily:'Inter,sans-serif', fontWeight:'800', fontSize:'15px' }}, '+');
  addBtn.addEventListener('click', () => {
    if (!nameIn.value.trim()) return;
    state.monthData[selectedMonth].jobs.push({ id: Date.now(), name: nameIn.value.trim(), betrag: parseFloat(betragIn.value)||0, prodKosten: parseFloat(prodIn.value)||0, status: statusSel.value });
    saveData(); render();
  });
  row2.append(betragIn, prodIn);
  row3.append(statusSel, addBtn);
  newCard.append(nameIn, row2, row3);
  wrap.append(newCard);
  return wrap;
}

function renderRechnungen() {
  const rechnungen = state.rechnungen;
  const totalOffen = rechnungen.filter(r=>r.status==='offen').reduce((s,r)=>s+r.betrag,0);
  const totalBezahlt = rechnungen.filter(r=>r.status==='bezahlt').reduce((s,r)=>s+r.betrag,0);
  const wrap = h('div', { style:{ display:'flex', flexDirection:'column', gap:'12px' }});

  // Übersicht
  wrap.append(
    h('div', { style:{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:'10px' }},
      h('div', { style:{ background:'#fff', border:'1px solid #e8000d18', borderRadius:'10px', padding:'16px 14px' }},
        h('div', { style:{ fontSize:'13px', textTransform:'uppercase', letterSpacing:'0.06em', color:'#888', marginBottom:'6px' }}, 'Noch offen'),
        h('div', { style:{ fontFamily:'Inter,sans-serif', fontWeight:'800', fontSize:'22px', color:'#E8000D' }}, fmt(totalOffen)),
        h('div', { style:{ fontSize:'13px', color:'#aaa', marginTop:'4px' }}, `${rechnungen.filter(r=>r.status==='offen').length} Rechnungen`)
      ),
      h('div', { style:{ background:'#fff', border:'1px solid #00C85318', borderRadius:'10px', padding:'16px 14px' }},
        h('div', { style:{ fontSize:'13px', textTransform:'uppercase', letterSpacing:'0.06em', color:'#888', marginBottom:'6px' }}, 'Bezahlt'),
        h('div', { style:{ fontFamily:'Inter,sans-serif', fontWeight:'800', fontSize:'22px', color:'#00C853' }}, fmt(totalBezahlt)),
        h('div', { style:{ fontSize:'13px', color:'#aaa', marginTop:'4px' }}, `${rechnungen.filter(r=>r.status==='bezahlt').length} Rechnungen`)
      )
    )
  );

  // Rechnungsliste
  rechnungen.slice().reverse().forEach(r => {
    const card = h('div', { style:{ background:'#fff', border:`1px solid ${r.status==='bezahlt'?'#00C85320':'#E8000D20'}`, borderRadius:'10px', padding:'14px' }});

    const row1 = h('div', { style:{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:'8px' }});
    const nameIn = h('input', { value: r.name, placeholder:'Kunde / Beschreibung', style:{ background:'transparent', border:'none', outline:'none', color:'#111', fontSize:'15px', fontFamily:'Inter,sans-serif', fontWeight:'700', width:'100%' }});
    nameIn.addEventListener('input', e => { r.name = e.target.value; saveRechnungen(); });

    const betragWrap = h('div', { style:{ display:'flex', alignItems:'center', gap:'3px', flexShrink:'0', marginLeft:'10px' }});
    const betragIn = h('input', { type:'number', value: r.betrag, style:{ background:'#f5f5f3', border:'1px solid #ddd', borderRadius:'6px', padding:'3px 6px', color:'#111', fontSize:'15px', fontFamily:'Inter,sans-serif', fontWeight:'800', outline:'none', width:'90px', textAlign:'right' }});
    betragIn.addEventListener('input', e => { r.betrag = parseFloat(e.target.value)||0; saveRechnungen(); render(); });
    betragWrap.append(betragIn, h('span', { style:{ color:'#888', fontSize:'13px' }}, '€'));
    row1.append(nameIn, betragWrap);

    const row2 = h('div', { style:{ display:'flex', justifyContent:'space-between', alignItems:'center' }});
    const datumIn = h('input', { type:'date', value: r.datum||'', style:{ background:'transparent', border:'none', outline:'none', color:'#888', fontSize:'13px', cursor:'pointer' }});
    datumIn.addEventListener('change', e => { r.datum = e.target.value; saveRechnungen(); });

    const rightRow = h('div', { style:{ display:'flex', alignItems:'center', gap:'8px' }});

    // Toggle bezahlt
    const toggle = h('div', { style:{ display:'flex', alignItems:'center', gap:'6px', cursor:'pointer' },
      onClick: () => { r.status = r.status==='bezahlt'?'offen':'bezahlt'; saveRechnungen(); render(); }},
      h('div', { style:{ width:'36px', height:'20px', borderRadius:'99px', background: r.status==='bezahlt'?'#00C853':'#ddd', position:'relative', transition:'background .2s' }},
        h('div', { style:{ position:'absolute', top:'3px', left: r.status==='bezahlt'?'19px':'3px', width:'14px', height:'14px', borderRadius:'50%', background:'#fff', transition:'left .2s' }})
      ),
      h('span', { style:{ fontSize:'13px', color: r.status==='bezahlt'?'#00C853':'#E8000D', fontFamily:'Inter,sans-serif', fontWeight:'700' }}, r.status==='bezahlt'?'Bezahlt':'Offen')
    );

    const delBtn = h('button', { style:{ background:'none', border:'none', cursor:'pointer', color:'#ccc', fontSize:'18px' }}, '×');
    delBtn.addEventListener('click', () => { state.rechnungen = state.rechnungen.filter(x=>x.id!==r.id); saveRechnungen(); render(); });

    rightRow.append(toggle, delBtn);
    row2.append(datumIn, rightRow);
    card.append(row1, row2);
    wrap.append(card);
  });

  // Neue Rechnung
  const newCard = h('div', { style:{ background:'#f0f0ee', border:'1px dashed #ccc', borderRadius:'10px', padding:'14px' }});
  newCard.append(h('div', { style:{ fontSize:'13px', textTransform:'uppercase', letterSpacing:'0.06em', color:'#888', marginBottom:'10px' }}, '+ Neue Rechnung'));
  const newName = h('input', { placeholder:'Kunde / Beschreibung', style:{ background:'#fff', border:'1px solid #ddd', borderRadius:'6px', padding:'8px 10px', color:'#111', fontSize:'15px', outline:'none', width:'100%', marginBottom:'8px' }});
  const row2 = h('div', { style:{ display:'grid', gridTemplateColumns:'1fr 1fr 50px', gap:'8px', marginBottom:'8px' }});
  const newBetrag = h('input', { type:'number', placeholder:'Betrag €', style:{ background:'#fff', border:'1px solid #ddd', borderRadius:'6px', padding:'8px 10px', color:'#111', fontSize:'15px', outline:'none' }});
  const newDatum = h('input', { type:'date', style:{ background:'#fff', border:'1px solid #ddd', borderRadius:'6px', padding:'8px 10px', color:'#111', fontSize:'13px', outline:'none' }});
  const addBtn = h('button', { style:{ background:'#F5A800', border:'none', borderRadius:'6px', cursor:'pointer', color:'#fff', fontFamily:'Inter,sans-serif', fontWeight:'800', fontSize:'18px' }}, '+');

  let newIsBrutto = false;
  const mwstCheck = h('input', { type:'checkbox', id:'mwst-check', style:{ width:'16px', height:'16px', cursor:'pointer', accentColor:'#111' }});
  mwstCheck.addEventListener('change', e => { newIsBrutto = e.target.checked; });
  const switchRow = h('div', { style:{ display:'flex', alignItems:'center', gap:'8px', marginBottom:'8px' }},
    mwstCheck,
    h('label', { for:'mwst-check', style:{ fontSize:'13px', color:'#888', cursor:'pointer' }}, 'zzgl. 19% MwSt. (Netto-Eingabe → Brutto wird berechnet)')
  );

  addBtn.addEventListener('click', () => {
    if (!newName.value.trim()) return;
    const eingabe = parseFloat(newBetrag.value)||0;
    const betrag = newIsBrutto ? eingabe * 1.19 : eingabe;
    state.rechnungen.push({ id: Date.now(), name: newName.value.trim(), betrag, bruttoEingabe: newIsBrutto ? eingabe : null, datum: newDatum.value, status: 'offen' });
    newName.value=''; newBetrag.value=''; newDatum.value=''; newIsBrutto=false;
    saveRechnungen(); render();
  });
  row2.append(newBetrag, newDatum, addBtn);
  newCard.append(newName, switchRow, row2);
  wrap.append(newCard);
  return wrap;
}

async function saveRechnungen() {
  try {
    await sbUpsertOn('fp_settings', 'user_id', {
      user_id: USER_ID, ziel: state.ziel, steuersatz: state.steuersatz,
      kosten_betrieb: state.kostenBetrieb, kosten_privat: state.kostenPrivat,
      rechnungen: state.rechnungen, updated_at: new Date().toISOString()
    });
  } catch(e) { console.error('Save rechnungen error:', e); }
}

function renderKosten(kb, kp) {

  wrap.append(h('div', { style:{ background:'#ffffff', border:'1px solid #e0e0dc', borderRadius:'10px', padding: isMobile ? '14px 16px' : '12px 14px' }},

      h('div', {},
        h('div', { style:{ fontSize:'13px', textTransform:'uppercase', letterSpacing:'0.1em', color:'#111' }}, 'Fixkosten gesamt / Monat'),

      ),
      h('span', { style:{ fontFamily:'Inter,sans-serif', fontWeight:'800', fontSize:'16px', color:'#111' }}, fmt(totalAll))

  ));

  wrap.append(makeKostenBlock('Betriebliche Kosten', kb, '#111', items => { state.kostenBetrieb = items; saveData(); render(); }, true));

      h('span', { style:{ fontFamily:'Inter,sans-serif', fontWeight:'700', fontSize:'15px', letterSpacing:'0.08em', textTransform:'uppercase', color:'#111' }}, `Sonderzahlungen — ${MONATE_LANG[state.selectedMonth]}`),
      h('span', { style:{ fontFamily:'Inter,sans-serif', fontWeight:'800', fontSize:'15px', color: totalSonder>0?'#E8000D':'#888' }}, totalSonder>0 ? `− ${fmt(totalSonder)}` : '0 €')
    ),
    h('div', { style:{ padding:'8px 14px 4px', fontSize:'13px', color:'#aaa' }}, 'Einmalige Ausgaben dieses Monats — Nachzahlungen, Anschaffungen etc.'),
    ...sonder.map((item, idx) => {
      const row = h('div', { style:{ display:'grid', gridTemplateColumns:'1fr 80px 28px', gap:'6px', padding:'6px 14px', borderBottom:'1px solid #eee', alignItems:'center' }});

      nameIn.addEventListener('input', e => { item.name = e.target.value; saveData(); });

      betragIn.addEventListener('input', e => { item.betrag = parseFloat(e.target.value)||0; saveData(); render(); });
      const del = h('button', { style:{ background:'none', border:'none', cursor:'pointer', color:'#aaa', fontSize:'15px' }}, '×');
      del.addEventListener('click', () => { state.monthData[state.selectedMonth].sonderzahlungen.splice(idx,1); saveData(); render(); });
      row.append(nameIn, betragIn, del);
      return row;
    }),
    (() => {
      const addWrap = h('div', { style:{ padding:'8px 14px' }});
      const addRow = h('div', { style:{ display:'grid', gridTemplateColumns:'1fr 80px 28px', gap:'6px', alignItems:'center', marginBottom:'8px' }});

      const addBtn = h('button', { style:{ background:'#E8000D', border:'none', borderRadius:'5px', cursor:'pointer', color:'#fff', fontWeight:'800', fontSize:'14px', width:'28px', height:'28px', padding:'0' }}, '+');
      addRow.append(newName, newBetrag, addBtn);

      const chk = h('input', { type:'checkbox', style:{ width:'15px', height:'15px', cursor:'pointer', accentColor:'#111' }});
      chk.addEventListener('change', e => { newIsBrutto = e.target.checked; });
      const checkRow = h('div', { style:{ display:'flex', alignItems:'center', gap:'8px' }},
        chk,
        h('span', { style:{ fontSize:'12px', color:'#888' }}, 'zzgl. 19% MwSt.')
      );
      addBtn.addEventListener('click', () => {
        if (!newName.value.trim()) return;
        if (!state.monthData[state.selectedMonth].sonderzahlungen) state.monthData[state.selectedMonth].sonderzahlungen = [];
        const eingabe = parseFloat(newBetrag.value)||0;
        const betrag = newIsBrutto ? eingabe * 1.19 : eingabe;
        state.monthData[state.selectedMonth].sonderzahlungen.push({ id: Date.now(), name: newName.value.trim(), betrag, isBrutto: newIsBrutto });
        newName.value=''; newBetrag.value=''; newIsBrutto=false;
        saveData(); render();
      });
      addWrap.append(addRow, checkRow);
      return addWrap;
    })()
  ));

  // Export / Import
  wrap.append(h('div', { style:{ background:'#fff', border:'1px solid #e0e0dc', borderRadius:'10px', padding:'16px 14px' }},
    h('div', { style:{ fontSize:'13px', textTransform:'uppercase', letterSpacing:'0.06em', color:'#888', marginBottom:'12px' }}, 'Datensicherung'),
    h('div', { style:{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:'10px' }},
      h('button', { style:{ background:'#111', border:'none', borderRadius:'8px', cursor:'pointer', color:'#fff', fontFamily:'Inter,sans-serif', fontWeight:'700', fontSize:'14px', padding:'12px', textAlign:'center' },
        onClick: () => exportData()
      }, '⬇ Export JSON'),
      h('label', { style:{ background:'#f5f5f3', border:'1px solid #ddd', borderRadius:'8px', cursor:'pointer', color:'#111', fontFamily:'Inter,sans-serif', fontWeight:'700', fontSize:'14px', padding:'12px', textAlign:'center', display:'block' }},
        '⬆ Import JSON',
        h('input', { type:'file', accept:'.json', style:{ display:'none' },
          onChange: e => { if (e.target.files[0]) importData(e.target.files[0]); }
        })
      )
    )
  ));
  return wrap;
}

function makeSwitch(isOn, onToggle) {
  const sw = h('div', { style:{ cursor:'pointer', display:'flex', alignItems:'center', gap:'5px' },
    onClick: onToggle },
    h('div', { style:{ width:'32px', height:'18px', borderRadius:'99px', background: isOn?'#111':'#ddd', position:'relative', transition:'background .2s', flexShrink:'0' }},
      h('div', { style:{ position:'absolute', top:'2px', left: isOn?'16px':'2px', width:'14px', height:'14px', borderRadius:'50%', background:'#fff', transition:'left .2s' }})
    ),
    h('span', { style:{ fontSize:'11px', color: isOn?'#111':'#aaa', fontWeight:'600', whiteSpace:'nowrap' }}, isOn?'Brutto':'Netto')
  );
  return sw;
}

function makeKostenBlock(titel, items, accent, onChange, showBrutto) {
  const block = h('div', { style:{ background:'#ffffff', border:'1px solid #e0e0dc', borderRadius:'10px' }});
  const totalAnzeige = items.reduce((s,i) => s + i.betrag, 0);
  block.append(h('div', { style:{ display:'flex', justifyContent:'space-between', alignItems:'center', padding:'12px 16px', borderBottom:'1px solid #eee' }},
    h('span', { style:{ fontFamily:'Inter,sans-serif', fontWeight:'700', fontSize:'15px', letterSpacing:'0.08em', textTransform:'uppercase', color:'#111' }}, titel),
    h('span', { style:{ fontFamily:'Inter,sans-serif', fontWeight:'800', fontSize:'15px', color:'#111' }}, `${fmt(totalAnzeige)}/Mo`)
  ));
  items.forEach(item => {
    const wrap = h('div', { style:{ borderBottom:'1px solid #eee' }});
    const row = h('div', { style:{ display:'grid', gridTemplateColumns:'1fr 80px 28px', gap:'6px', padding:'6px 14px', alignItems:'center' }});
    const nameIn = h('input', { value: item.name, style:{ background:'transparent', border:'none', outline:'none', color:'#111', fontSize:'15px', width:'100%' }});
    nameIn.addEventListener('input', e => { item.name = e.target.value; onChange([...items]); });
    const betragIn = h('input', { type:'number', value: item.betrag, style:{ background:'#e5e5e5', border:'1px solid #ddd', borderRadius:'5px', padding:'3px 6px', color:'#111', fontSize:'15px', width:'100%', textAlign:'right', outline:'none' }});
    betragIn.addEventListener('input', e => { item.betrag = parseFloat(e.target.value)||0; onChange([...items]); });
    const del = h('button', { style:{ background:'none', border:'none', cursor:'pointer', color:'#aaa', fontSize:'15px' }}, '×');
    del.addEventListener('click', () => onChange(items.filter(i=>i.id!==item.id)));
    row.append(nameIn, betragIn, del);
    wrap.append(row);
    if (showBrutto && item.isBrutto) {
      wrap.append(h('div', { style:{ padding:'2px 14px 6px', fontSize:'11px', color:'#aaa' }}, `Netto: ${fmt(item.betrag/1.19)}`));
    }
    block.append(wrap);
  });
  // Neue Zeile
  const addWrap = h('div', { style:{ padding:'8px 14px' }});
  const addRow = h('div', { style:{ display:'grid', gridTemplateColumns:'1fr 80px 28px', gap:'6px', alignItems:'center', marginBottom: showBrutto?'8px':'0' }});
  const newName = h('input', { placeholder:'+ Neue Position', style:{ background:'#ebebeb', border:'1px dashed #ccc', borderRadius:'5px', padding:'4px 8px', color:'#111', fontSize:'14px', outline:'none' }});
  const newBetrag = h('input', { type:'number', placeholder:'0', style:{ background:'#ebebeb', border:'1px dashed #ccc', borderRadius:'5px', padding:'4px 6px', color:'#111', fontSize:'14px', textAlign:'right', outline:'none' }});
  const addBtn = h('button', { style:{ background:'#111', border:'none', borderRadius:'5px', cursor:'pointer', color:'#fff', fontWeight:'800', fontSize:'16px', width:'28px', height:'28px', padding:'0' }}, '+');
  addRow.append(newName, newBetrag, addBtn);
  addWrap.append(addRow);

  let newIsBrutto = false;
  if (showBrutto) {
    const chk = h('input', { type:'checkbox', style:{ width:'15px', height:'15px', cursor:'pointer', accentColor:'#111' }});
    chk.addEventListener('change', e => { newIsBrutto = e.target.checked; });
    addWrap.append(h('div', { style:{ display:'flex', alignItems:'center', gap:'8px', marginTop:'6px' }},
      chk,
      h('span', { style:{ fontSize:'12px', color:'#888' }}, 'zzgl. 19% MwSt.')
    ));
  }

  addBtn.addEventListener('click', () => {
    if (!newName.value.trim()) return;
    const eingabe = parseFloat(newBetrag.value)||0;
    const betrag = newIsBrutto ? eingabe * 1.19 : eingabe;
    onChange([...items, { id: Date.now(), name: newName.value.trim(), betrag, isBrutto: newIsBrutto }]);
    newName.value = ''; newBetrag.value = ''; newIsBrutto = false;
  });
  block.append(addWrap);
  return block;
}

async function loadMonthIfNeeded() {
  const m = state.selectedMonth;
  if (state.monthData[m].loaded) return;
  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/fp_month_data?user_id=eq.${USER_ID}&year=eq.${NOW_YEAR}&month=eq.${m}`, {
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' }
    });
    const d = await r.json();
    if (d[0]) state.monthData[m] = { month: m, jobs: d[0].jobs||[], sonderzahlungen: d[0].sonderzahlungen||[], loaded: true };
    else state.monthData[m].loaded = true;
    render();
  } catch(e) {}
}

function exportData() {
  const data = {
    exportDatum: new Date().toISOString(),
    ziel: state.ziel,
    steuersatz: state.steuersatz,
    kostenBetrieb: state.kostenBetrieb,
    kostenPrivat: state.kostenPrivat,
    rechnungen: state.rechnungen,
    monthData: state.monthData,
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `romans-finanzen-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importData(file) {
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if (data.ziel) state.ziel = data.ziel;
      if (data.steuersatz) state.steuersatz = data.steuersatz;
      if (data.kostenBetrieb) state.kostenBetrieb = data.kostenBetrieb;
      if (data.kostenPrivat) state.kostenPrivat = data.kostenPrivat;
      if (data.rechnungen) state.rechnungen = data.rechnungen;
      if (data.monthData) state.monthData = data.monthData;
      saveData();
      render();
      alert('Import erfolgreich ✓');
    } catch(e) { alert('Fehler beim Import — ungültige Datei'); }
  };
  reader.readAsText(file);
}

// ── Init ──
loadData();
</script>
